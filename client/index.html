<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Helpdesk Management System</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="app app-view">

    <aside class="sidebar">

        <div class="logo sidebar-brand">

            <h2>HAMS</h2>

            <p>Helpdesk Management</p>

        </div>

        <nav id="sidebarMenu" class="nav-list"></nav>

        <button id="logoutBtn" class="ghost-button sidebar-footer">

            Logout

        </button>

    </aside>

    <main class="main workspace">

        <header class="topbar">

            <h1 id="pageTitle">

                Dashboard

            </h1>

            <div class="topbar-actions">

                Welcome

                <span id="username"></span>

            </div>

        </header>

        <section id="pageContent" class="content">

        </section>

    </main>

</div>

<div
id="modal"
class="modal"
style="display:none">

<div class="modal-content modal-panel">

<button id="closeModal">

&times;

</button>

<div id="modalBody">

</div>

</div>

</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/helpers.js"></script>
<script src="js/toast.js"></script>
<script src="js/modal.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/complaint.js"></script>
<script src="js/assets.js"></script>
<script src="js/users.js"></script>
<script src="js/reports.js"></script>
<script src="js/profile.js"></script>
<script src="js/router.js"></script>
<script src="js/app.js"></script>


</body>
</html>
